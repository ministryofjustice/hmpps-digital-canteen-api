generic-service:
  nameOverride: hmpps-digital-canteen-api
  productId: "DPS128" # productId for the product that this belongs too, i.e. DPS001, see README.md for details

  replicaCount: 4

  image:
    repository: ghcr.io/ministryofjustice/hmpps-digital-canteen-api
    tag: app_version # override at deployment time
    port: 8080

  ingress:
    enabled: true
    host: app-hostname.local # override per environment
    tlsSecretName: hmpps-digital-canteen-cert

  # Environment variables to load into the deployment
  env:
    SERVER_PORT: "8080"
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: "applicationinsights.json"

  # Secret env vars
  namespace_secrets:
    rds-postgresql-instance-output:
      DB_HOST: rds_instance_address
      DB_NAME: database_name
      DB_USER: database_username
      DB_PASSWORD: database_password
    hmpps-digital-canteen-api-application-insights:
      APPLICATIONINSIGHTS_CONNECTION_STRING: "APPLICATIONINSIGHTS_CONNECTION_STRING"
    hmpps-digital-canteen-api-client-creds:
      CLIENT_ID: 'API_CLIENT_ID'
      CLIENT_SECRET: 'API_CLIENT_SECRET'
    medusa-secrets:
      JWT_SECRET: "jwt-secret"
      COOKIE_SECRET: "cookie-secret"
      ADMIN_EMAIL: "admin-email"
      ADMIN_PASSWORD: "admin-password"
      API_MEDUSA_PUBLISHABLE_KEY: "publishable-api-key"
    bt-client-creds:
      BT_CLIENT_ID: 'BT_CLIENT_ID'
      BT_CLIENT_SECRET: 'BT_CLIENT_SECRET'

  allowlist:
    groups:
      - internal

generic-prometheus-alerts:
  targetApplication: hmpps-digital-canteen-api
